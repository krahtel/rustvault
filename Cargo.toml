[package]
name = "rustvault"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
argon2 = "0.6.0"
aes-gcm = "0.11.1"
rand = "0.10.2"
sha2 = "0.11.0"
base64 = "0.23.1"
zeroize = { version = "1.9.0", features = ["derive"] }
hex = "0.4.3"
hkdf = "0.13.0"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
reqwest = {
    version = "0.12",
    default-features = false,
    features = ["multipart", "json", "rustls-tls"] }
async-trait = "0.1"
